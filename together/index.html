<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Together</title>
  <meta name="description" content="A shared pregnancy app for couples: daily check-ins, live partner view, and safety lookups.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon-512.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Together">
  <meta name="theme-color" content="#fbf6f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1720" media="(prefers-color-scheme: dark)">
  <meta name="format-detection" content="telephone=no">
  <link rel="stylesheet" href="app.css?v=5">
</head>
<body>
  <div id="app"></div>
  <noscript>Together needs JavaScript turned on.</noscript>
  <script>
    // Safety net: if the app hasn't drawn anything a few seconds after load
    // (a failed download, an old cached file), show a way out instead of a
    // blank screen. "Repair" only clears downloaded app files, never your data.
    function tgRescue() {
      var app = document.getElementById('app')
      if (!app || app.children.length) return
      app.innerHTML = '<div style="padding:48px 24px;text-align:center;font:16px -apple-system,sans-serif">' +
        '<div style="font-size:48px">🤍</div><h2>Together didn\'t finish loading</h2>' +
        '<p style="opacity:.75">Your check-ins are safe on this phone. Tap below to refresh the app files.</p>' +
        '<button onclick="tgRepair()" style="margin-top:12px;padding:14px 22px;border:0;border-radius:14px;background:#c9789b;color:#fff;font-size:16px;font-weight:600">Repair &amp; reload</button></div>'
    }
    function tgRepair() {
      var jobs = []
      if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.filter(function (k) { return k.indexOf('together-') === 0 }).map(function (k) { return caches.delete(k) })) }))
      if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.filter(function (r) { return r.scope.indexOf('/together/') > -1 }).map(function (r) { return r.unregister() })) }))
      Promise.all(jobs).catch(function () {}).then(function () { location.reload() })
    }
    window.addEventListener('error', function () { setTimeout(tgRescue, 300) }, true)
    setTimeout(tgRescue, 5000)
  </script>
  <script type="module" src="app.js?v=5"></script>
</body>
</html>
